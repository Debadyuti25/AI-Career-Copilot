{% extends "base.html" %}
{% block content %}
<style>
    .forgot-box{
        max-width:400px;
        margin:80px auto;
        background:white;
        padding:35px;
        border-radius:20px;
        box-shadow:0 10px 30px rgba(0,0,0,0.08);
        text-align:center;
    }
    .forgot-box h2{
        font-weight:800;
        margin-bottom:10px;
    }
    .forgot-box p{
        color:#6b7280;
        font-size:14px;
        margin-bottom:20px;
    }
    .forgot-box input{
        width:100%;
        padding:13px;
        border:1px solid #e5e7eb;
        border-radius:10px;
        margin:10px 0;
        outline:none;
    }
    .forgot-box input:focus{
        border-color:#6366f1;
    }
    .forgot-box button{
        width:100%;
        padding:13px;
        background:#6366f1;
        color:white;
        border:none;
        border-radius:10px;
        font-weight:700;
        margin-top:15px;
        cursor:pointer;
    }
    .forgot-box button:hover{
        background:#4f46e5;
    }
</style>

<div class="forgot-box">
    <h2>Forgot Password?</h2>
    <p>Enter your registered email to reset</p>

    {% if error %}
        <p style="color:#ef4444; background:#fef2f2; padding:10px; border-radius:8px; font-weight:600;">{{ error }}</p>
    {% endif %}

    <form method="POST">
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Verify Email</button>
    </form>

    <p style="margin-top:20px; font-size:13px;">
        <a href="/login" style="color:#6366f1; text-decoration:none; font-weight:600;">Back to Login</a>
    </p>
</div>
{% endblock %}
