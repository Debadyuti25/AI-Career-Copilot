{% extends "base.html" %}
{% block content %}
<div style="max-width:400px;margin:60px auto;background:white;padding:30px;border-radius:16px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.08)">
<h2>Reset for {{email}}</h2>
{% if error %}<p style="color:red">{{error}}</p>{% endif %}
<form method="POST">
<input type="password" name="new_password" placeholder="New Password" required style="width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px">
<input type="password" name="confirm_password" placeholder="Confirm Password" required style="width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px">
<button type="submit" style="width:100%;padding:12px;background:#10b981;color:white;border:none;border-radius:8px;font-weight:700">Update Password</button>
</form></div>
{% endblock %}
